name: GozAltiVoice
options:
  bundleIdPrefix: com.gozalti
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  GozAltiVoice:
    type: application
    platform: iOS
    sources: [Sources]
    # A real Info.plist rather than INFOPLIST_KEY_* build settings, because ATS needs a
    # nested dictionary and the build-setting shorthand only does flat strings.
    info:
      path: Sources/Info.plist
      properties:
        # Permission strings. iOS kills the app on first use if any of these is missing.
        NSMicrophoneUsageDescription: "Needed to hear your spoken answer when you leave your route."
        NSSpeechRecognitionUsageDescription: "Speech is recognised on-device to understand yes or no."
        NSLocationWhenInUseUsageDescription: "Your position is included in the alert sent to your contact, so they know where to look."
        NSLocalNetworkUsageDescription: "Reaches the GözAltı alert service on your local network."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Scoped to local addresses only — NOT a blanket ATS disable. The alert service
        # runs on the Acer box over plain HTTP on the venue LAN.
        NSAppTransportSecurity:
          # NSAllowsLocalNetworking covers .local and link-local names, but its treatment
          # of a bare private-range IP over http is exactly the ambiguity that costs an
          # hour on demo day. This build is a POC that talks to one box on the venue LAN,
          # so it allows plain http outright rather than gambling on the narrower rule.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gozalti.voice
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
