[project]
name = "gozalti-osint"
version = "0.1.0"
description = "Area-level Seattle safety-perception signals (AreaSignal, SPEC.md §6.3) from public sources"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "feedparser>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[project.scripts]
osint = "osint.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osint"]
