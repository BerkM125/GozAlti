<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>audio-lm — voice confirmation</title>
<!-- Phone-first. STT/TTS run on-device via the Web Speech API; the decision lives in
     service.py's state machine. Requires a SECURE CONTEXT for the mic: https:// or
     localhost. On a plain-http LAN address iOS silently denies it — see the banner. -->
<style>
:root{--bg:#0d1016;--card:#161b23;--line:#242c38;--ink:#e6eaf0;--dim:#8b95a4;
--go:#3ddc84;--warn:#f2a93b;--bad:#e8443a;--mono:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif;
padding:16px;padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h1 b{color:var(--go);font-weight:600}
.state{font:11px var(--mono);color:var(--dim);margin-top:2px}
.banner{background:#2a1d14;border-left:3px solid var(--warn);padding:10px 12px;
border-radius:0 4px 4px 0;font:12px var(--mono);color:var(--warn);margin:12px 0;display:none}
.banner.on{display:block}
.said{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--go);
border-radius:0 6px 6px 0;padding:14px 16px;margin:14px 0;font-size:18px;line-height:1.45;min-height:64px}
.heard{font:13px var(--mono);color:var(--dim);margin:8px 0;min-height:20px}
.heard b{color:var(--ink);font-weight:400}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button{flex:1 1 0;min-width:96px;background:var(--card);color:var(--ink);
border:1px solid var(--line);border-radius:10px;padding:16px 12px;font:15px inherit;cursor:pointer}
button:active{background:#1e2530}
button.mic{flex:1 1 100%;background:var(--go);color:#0d1016;font-weight:700;border-color:var(--go);font-size:17px}
button.mic.live{background:var(--bad);border-color:var(--bad);color:#fff}
button.cancel{background:#2a1618;border-color:#4a2226;color:var(--bad)}
.pill{display:inline-block;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;
padding:3px 8px;border-radius:3px;border:1px solid currentColor}
.s-escalate{color:var(--bad)}.s-ok{color:var(--go)}.s-wait{color:var(--warn)}.s-idle{color:var(--dim)}
table{width:100%;border-collapse:collapse;font:11px var(--mono);margin-top:8px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
h2{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.note{font:11px var(--mono);color:var(--dim);line-height:1.7}
</style>

<h1>audio<b>·</b>lm — voice confirmation</h1>
<div class=state id=state>idle</div>
<div class=banner id=banner></div>

<div class=said id=said>Press <b>simulate off-path</b> to start the confirmation dialogue.</div>
<div class=heard id=heard></div>

<button class=mic id=mic disabled>hold to answer</button>
<div class=row>
  <button id=start>simulate off-path</button>
  <button id=keyword>keyword trigger</button>
</div>
<div class=row>
  <button id=yes disabled>“yes”</button>
  <button id=no disabled>“no”</button>
  <button id=mumble disabled>“mumble”</button>
  <button class=cancel id=cancel disabled>cancel</button>
</div>

<h2>transcript — every hop is auditable</h2>
<table id=log><tbody></tbody></table>

<h2>notes</h2>
<div class=note id=notes></div>

<script>
const $ = s => document.querySelector(s);
const API = location.origin;
let SID = null, rec = null, listening = false;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const secure = window.isSecureContext;

function banner(msg){ const b=$('#banner'); b.textContent=msg; b.classList.toggle('on', !!msg); }

if (!secure) {
  banner("Mic blocked: this page is not a secure context. Voice needs https:// or localhost — "
       + "on a plain-http LAN address iOS denies the mic silently. Tap buttons still work.");
} else if (!SR) {
  banner("This browser has no Web Speech API. Tap buttons still work.");
}

$('#notes').innerHTML =
  `secure context: <b>${secure}</b> · SpeechRecognition: <b>${!!SR}</b> · `
  + `speechSynthesis: <b>${!!window.speechSynthesis}</b><br>`
  + `The decision is made by the state machine on the server, never by a language model. `
  + `Escalation needs TWO explicit answers, silence never escalates, and cancel always wins.`;

function speak(text){
  if (!text || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.02; u.pitch = 1.0;
  speechSynthesis.speak(u);
}

function render(r){
  SID = r.session_id || SID;
  const cls = r.state === 'escalate' ? 's-escalate'
            : (r.state === 'resolved_ok' || r.state === 'cancelled') ? 's-ok'
            : r.state === 'needs_attention' ? 's-wait' : 's-idle';
  $('#state').innerHTML = `<span class="pill ${cls}">${r.state}</span> `
    + `session ${r.session_id || '—'} · turn ${r.turns ?? 0}`
    + (r.reprompts ? ` · reprompt ${r.reprompts}` : '');
  if (r.say) { $('#said').textContent = r.say; speak(r.say); }
  const active = SID && !r.done;
  for (const id of ['yes','no','mumble','cancel','mic']) $('#'+id).disabled = !active;
  if (r.escalation) {
    banner(r.escalation.delivered
      ? "Escalation handed to offpath-911 (SIMULATED endpoint)."
      : "Escalation confirmed but NOT delivered: " + (r.escalation.why || 'unknown'));
  }
  if (r.done && r.state === 'escalate') $('#cancel').disabled = false;   // abort must remain
  refreshLog();
}

async function post(path, body){
  const res = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'},
                                       body: JSON.stringify(body||{})});
  return res.json();
}

async function refreshLog(){
  if (!SID) return;
  const r = await (await fetch(`${API}/session/${SID}`)).json();
  $('#log tbody').innerHTML = '<tr><th>from</th><th>heard</th><th>conf</th><th>intent</th><th>to</th></tr>'
    + (r.transcript||[]).map(t =>
        `<tr><td>${t.from}</td><td>${t.heard||'—'}</td><td>${t.confidence.toFixed(2)}</td>
         <td>${t.intent}</td><td>${t.to}</td></tr>`).join('');
}

async function begin(trigger){
  const r = await post('/session', {trigger});
  $('#heard').textContent = '';
  banner('');
  render(r);
}

async function hear(transcript, confidence){
  $('#heard').innerHTML = `heard: <b>${transcript}</b> (${confidence.toFixed(2)})`;
  render(await post(`/session/${SID}/hear`, {transcript, confidence,
    evidence: {note: "demo — no real location attached"}}));
}

$('#start').onclick = () => begin('offpath');
$('#keyword').onclick = () => begin('keyword');
$('#yes').onclick = () => hear('yes', 0.95);
$('#no').onclick = () => hear('no', 0.95);
$('#mumble').onclick = () => hear('uhh mmm', 0.9);
$('#cancel').onclick = async () => render(await post(`/session/${SID}/cancel`));

// --- real microphone -------------------------------------------------------------
if (SR && secure) {
  rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    const res = e.results[e.results.length - 1][0];
    // The recogniser's own confidence is passed through untouched — the state machine
    // treats anything under its threshold as not heard rather than as a best guess.
    hear(res.transcript.trim(), typeof res.confidence === 'number' ? res.confidence : 0.9);
  };
  rec.onerror = ev => banner('speech error: ' + ev.error);
  rec.onend = () => { listening = false; $('#mic').classList.remove('live');
                      $('#mic').textContent = 'hold to answer'; };
  const startRec = e => { e.preventDefault(); if (listening || !SID) return;
    listening = true; $('#mic').classList.add('live'); $('#mic').textContent = 'listening…';
    try { rec.start(); } catch {} };
  const stopRec = e => { e.preventDefault(); if (listening) try { rec.stop(); } catch {} };
  $('#mic').addEventListener('touchstart', startRec);
  $('#mic').addEventListener('touchend', stopRec);
  $('#mic').addEventListener('mousedown', startRec);
  $('#mic').addEventListener('mouseup', stopRec);
} else {
  $('#mic').textContent = 'mic unavailable — use the buttons';
}
</script>
