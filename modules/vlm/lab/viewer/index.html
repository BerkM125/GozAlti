<!doctype html>
<!--
  GozAlti — VLM module viewer. Video Search and Summarization over Seattle SDOT cameras.

  Zero build step, zero network. No CDN, no framework, no webfont, no analytics: the
  venue wifi dies constantly and this has to survive being offline in front of judges.
  Everything it needs is this file plus data/ written by video.py.

    python3 -m http.server 8099 --bind 0.0.0.0 -d modules/vlm/lab/viewer

  Every number shown here was measured by the pipeline. Nothing is scored, ranked for
  danger, or judged — the VLM describes what it sees and says "not visible" when it
  cannot tell.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GozAlti — Camera VSS</title>
<style>
  :root{
    --bg:#0a0c0f; --panel:#12161b; --panel2:#171c23; --line:#242b34;
    --fg:#e8ecf2; --mut:#8b95a5; --dim:#5c6673;
    --ppl:#3ddc84; --veh:#5aa9e6; --warn:#f0b22e; --bad:#e8443a; --vlm:#c08cf5;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--mono);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--veh)}
  .wrap{max-width:1560px;margin:0 auto;padding:14px 16px 60px}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  header h1{font-size:19px;margin:0;letter-spacing:.02em}
  header h1 b{color:var(--ppl)}
  .sub{color:var(--mut);font-size:12px}
  .pipe{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap}
  .pipe i{font-style:normal;color:var(--mut)}

  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav button{
    background:var(--panel);color:var(--mut);border:1px solid var(--line);
    border-radius:4px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;
    text-align:left;line-height:1.3;
  }
  nav button:hover{border-color:#3a4553;color:var(--fg)}
  nav button[aria-current="true"]{background:#17241d;border-color:var(--ppl);color:var(--fg)}
  nav button span{display:block;color:var(--dim);font-size:11px}
  nav button[aria-current="true"] span{color:var(--mut)}
  :focus-visible{outline:2px solid var(--ppl);outline-offset:2px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 11px}
  .tile .k{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .v{font-size:27px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
  .tile .n{color:var(--dim);font-size:10.5px;margin-top:1px}
  .tile.ppl .v{color:var(--ppl)} .tile.veh .v{color:var(--veh)}
  .tile.vlm .v{color:var(--vlm)} .tile.warn .v{color:var(--warn)}

  .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
  @media(max-width:1080px){.cols{grid-template-columns:1fr}}

  section.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;
    padding:11px 13px;margin-bottom:14px}
  section.card>h2{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--mut);font-weight:600;display:flex;gap:8px;align-items:baseline}
  section.card>h2 em{font-style:normal;color:var(--dim);letter-spacing:0;text-transform:none;font-size:11px}

  video{width:100%;display:block;background:#000;border-radius:4px}
  .vhint{color:var(--dim);font-size:11px;margin-top:6px}

  .chart{width:100%;height:190px;display:block;touch-action:none;cursor:crosshair}
  .chart text{fill:var(--dim);font-size:10px;font-family:var(--mono)}
  .legend{display:flex;gap:14px;color:var(--mut);font-size:11px;margin-top:2px;flex-wrap:wrap}
  .legend b{font-weight:400;color:var(--fg)}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px}

  .summary .head{color:var(--ppl);font-size:16px;line-height:1.35;margin-bottom:7px}
  .summary p{margin:0 0 9px}
  .notes{list-style:none;margin:0;padding:0}
  .notes li{display:flex;gap:9px;padding:3px 0;border-top:1px solid var(--line)}
  .notes li b{color:var(--warn);font-weight:400;min-width:74px;font-variant-numeric:tabular-nums}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{background:var(--panel2);border:1px solid var(--line);border-radius:3px;
    padding:2px 7px;font-size:11px;color:var(--mut)}
  .tag.ev{border-color:#4a3a1a;color:var(--warn)}
  .tag.wk{border-color:#3a2020;color:var(--bad)}

  .chunks{display:flex;flex-direction:column;gap:8px;max-height:660px;overflow-y:auto}
  .chunk{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px;
    cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
  .chunk:hover{border-color:#3a4553}
  .chunk[aria-current="true"]{border-color:var(--ppl);background:#141f19}
  .chunk img{width:100%;border-radius:3px;display:block;background:#000}
  .chunk .t{color:var(--warn);font-size:11px;font-variant-numeric:tabular-nums}
  .chunk .c{margin:3px 0 4px}
  .chunk .ch{color:var(--mut);font-size:12px}
  .chunk .m{color:var(--dim);font-size:11px;margin-top:4px}

  table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    position:sticky;top:0;background:var(--panel);cursor:pointer}
  td:first-child,th:first-child,td.l,th.l{text-align:left}
  .scroll{max-height:340px;overflow:auto}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}

  .qa{display:flex;flex-direction:column;gap:9px}
  .q{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:9px 10px}
  .q .qq{color:var(--veh);margin-bottom:4px}
  .q .qa2{margin-bottom:5px}
  .q .ev{color:var(--dim);font-size:11.5px}
  .q .ev b{color:var(--warn);font-weight:400}
  .badge{display:inline-block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .badge.ok{background:#17241d;color:var(--ppl);border:1px solid #24503a}
  .badge.no{background:#241a17;color:var(--warn);border:1px solid #4a3a1a}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:12px}
  .kv dt{color:var(--mut)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
  .foot{color:var(--dim);font-size:11.5px;margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
  .err{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>GozAlti</b> · camera VSS</h1>
    <span class="sub" id="hdrsub">Seattle SDOT traffic cameras</span>
    <span class="pipe"><i>ingest</i> → <i>index</i> → <i>caption</i> → <i>summarize</i> → <i>ask</i></span>
  </header>

  <nav id="tabs" aria-label="Clips"></nav>
  <div id="app" aria-live="polite"></div>

  <p class="foot" id="foot"></p>
</div>

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const num = (v, d) => v == null ? "—" : (d != null ? Number(v).toFixed(d) : v);

let INDEX = null, DOC = null, CUR = null;

async function boot(){
  try {
    INDEX = await (await fetch("data/index.json", {cache:"no-store"})).json();
  } catch (e) {
    $("#app").innerHTML = `<section class="card"><h2>no data</h2>
      <p class="err">Could not read <code>data/index.json</code>.</p>
      <p>Generate it on the box, then reload:</p>
      <pre>docker run --rm --gpus all --network host \\
  -v /home/acer01/GozAlti/modules/vlm/lab:/lab -w /lab \\
  -v /home/acer01/junk/torchcache:/root/.cache/torch \\
  --entrypoint python3 vllm/vllm-openai:latest video.py clips/*.mp4 --keypoints</pre></section>`;
    return;
  }
  const nav = $("#tabs");
  INDEX.clips.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `${esc(c.camera_id || c.clip_id)}
      <span>${esc(c.resolution)} · ${c.unique_people} unique · peak ${c.people_peak}</span>`;
    b.onclick = () => load(c.clip_id, b);
    nav.appendChild(b);
    if (i === 0) setTimeout(() => load(c.clip_id, b), 0);
  });
  $("#foot").textContent = `generated ${INDEX.generated_at} · ${INDEX.clips.length} clips · `
    + `served offline, no external requests`;
}

async function load(clipId, btn){
  document.querySelectorAll("#tabs button").forEach(b => b.removeAttribute("aria-current"));
  if (btn) btn.setAttribute("aria-current", "true");
  CUR = clipId;
  DOC = await (await fetch(`data/${clipId}/timeline.json`, {cache:"no-store"})).json();
  render();
}

function render(){
  const d = DOC, ag = d.aggregate, th = d.throughput, cfg = d.config, v = d.video;
  $("#hdrsub").textContent = `${d.camera_id || d.clip_id} · ${v.width}×${v.height} @ ${v.src_fps} fps `
    + `· ${v.duration_s.toFixed(0)} s`;

  const rt = th.realtime_at_source_fps;
  const tiles = [
    ["ppl", "unique people", ag.unique_people, `tracked over ${v.duration_s.toFixed(0)} s`],
    ["ppl", "peak in frame", ag.people_peak, `at ${mmss(ag.people_peak_at_s)} · mean ${ag.people_mean}`],
    ["veh", "peak vehicles", ag.vehicles_peak, `mean ${ag.vehicles_mean} per frame`],
    ["", "median dwell", ag.dwell_median_s + "s", `longest ${ag.dwell_max_s}s`],
    ["", "detector", num(th.per_frame_total_ms,1) + "ms", `${num(th.detector_fps,2)} fps · ${cfg.arch}${cfg.keypoints ? " + kp" : ""}`],
    [rt ? "" : "warn", "realtime", rt ? "yes" : "no", `vs ${v.src_fps} fps source`],
    ["vlm", "VLM calls", th.vlm_calls || 0, `${num(th.vlm_total_s,1)}s total · ${cfg.vlm_model || "off"}`],
    ["vlm", "chunk caption", th.vlm_chunk_mean_s == null ? "—" : num(th.vlm_chunk_mean_s,1) + "s", `mean per ${cfg.chunk_s}s chunk`],
  ];
  const tileHtml = `<div class="tiles">` + tiles.map(([c,k,val,n]) =>
    `<div class="tile ${c}"><div class="k">${esc(k)}</div><div class="v">${esc(val)}</div>
     <div class="n">${esc(n)}</div></div>`).join("") + `</div>`;

  $("#app").innerHTML = tileHtml + `<div class="cols">
    <div>
      <section class="card"><h2>annotated clip <em>track ids, trails, ${cfg.keypoints ? "skeletons, " : ""}counts burned in</em></h2>
        <video id="vid" controls preload="metadata" playsinline></video>
        <p class="vhint">Sampled at ${cfg.sample_fps} fps and played back over the source duration.
          Each colour is one tracked person; the trail is where they came from.</p>
      </section>
      <section class="card"><h2>timeline <em>counted per sampled frame · click to seek</em></h2>
        <svg class="chart" id="chart" role="img" aria-label="People and vehicle counts over the clip"></svg>
        <div class="legend">
          <span><i class="sw" style="background:var(--ppl)"></i><b>people</b> in frame</span>
          <span><i class="sw" style="background:var(--veh)"></i><b>vehicles</b> in frame</span>
          <span><i class="sw" style="background:var(--warn)"></i>chunk boundary</span>
          <span id="hov"></span>
        </div>
      </section>
      <section class="card"><h2>tracks <em>${ag.tracks_total} raw, ${ag.unique_people} seen in 2+ frames</em></h2>
        <div class="scroll"><table id="trk"><thead><tr>
          <th class="l" data-k="id">id</th><th data-k="t_start">enters</th><th data-k="dwell_s">dwell</th>
          <th data-k="frames">frames</th><th data-k="speed_bh_s">speed</th>
          <th class="l" data-k="motion">motion</th><th class="l" data-k="travel_label">travel</th>
          <th class="l" data-k="facing">facing</th><th data-k="mean_conf">conf</th>
        </tr></thead><tbody></tbody></table></div>
        <p class="vhint">Speed is in body-heights per second — the only scale one fixed camera gives
          for free, and it cancels perspective. Travel and facing are image-plane, not compass
          bearings: there is no homography here.</p>
      </section>
    </div>
    <div>
      <section class="card summary"><h2>clip summary <em>VLM over the chunk captions</em></h2>
        <div id="sum"></div>
      </section>
      <section class="card"><h2>questions <em>answered from captions + timeline only</em></h2>
        <div class="qa" id="qa"></div>
      </section>
      <section class="card"><h2>chunk captions <em>${d.chunks.length} × ${cfg.chunk_s}s · click to seek</em></h2>
        <div class="chunks" id="chunks"></div>
      </section>
      <section class="card"><h2>measured pipeline <em>every figure timed, none estimated</em></h2>
        <dl class="kv" id="perf"></dl>
      </section>
    </div>
  </div>`;

  const vid = $("#vid");
  vid.src = `data/${CUR}/annotated.mp4`;
  drawChart();
  drawSummary();
  drawQA();
  drawChunks();
  drawTracks();
  drawPerf();
  vid.addEventListener("timeupdate", () => { playhead(vid.currentTime); syncChunk(vid.currentTime); });
}

/* ---------------------------------------------------------------- chart */
const CH = {w:900, h:190, pad:{l:34, r:10, t:10, b:20}};
function drawChart(){
  const tl = DOC.timeline, dur = DOC.video.duration_s;
  const maxP = Math.max(1, ...tl.map(r => r.people));
  const maxV = Math.max(1, ...tl.map(r => r.vehicles));
  const top = Math.max(maxP, maxV);
  const {w,h,pad} = CH;
  const X = t => pad.l + (t/dur) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v/top) * (h - pad.t - pad.b);
  const path = key => tl.map((r,i) => `${i?"L":"M"}${X(r.t).toFixed(1)},${Y(r[key]).toFixed(1)}`).join("");
  const area = tl.map((r,i) => `${i?"L":"M"}${X(r.t).toFixed(1)},${Y(r.people).toFixed(1)}`).join("")
    + `L${X(dur).toFixed(1)},${Y(0)}L${X(0)},${Y(0)}Z`;

  let g = "";
  const step = top <= 6 ? 2 : top <= 15 ? 5 : 10;
  for (let v = 0; v <= top; v += step)
    g += `<line x1="${pad.l}" y1="${Y(v)}" x2="${w-pad.r}" y2="${Y(v)}" stroke="#242b34"/>
          <text x="${pad.l-6}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`;
  for (const c of DOC.chunks)
    g += `<line x1="${X(c.t0)}" y1="${pad.t}" x2="${X(c.t0)}" y2="${h-pad.b}" stroke="#4a3a1a"/>`;
  for (let t = 0; t <= dur; t += 10)
    g += `<text x="${X(t)}" y="${h-6}" text-anchor="middle">${mmss(t)}</text>`;

  $("#chart").setAttribute("viewBox", `0 0 ${w} ${h}`);
  $("#chart").innerHTML = g
    + `<path d="${area}" fill="#3ddc84" opacity=".13"/>`
    + `<path d="${path("people")}" fill="none" stroke="#3ddc84" stroke-width="1.8"/>`
    + `<path d="${path("vehicles")}" fill="none" stroke="#5aa9e6" stroke-width="1.5" opacity=".85"/>`
    + `<line id="ph" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${h-pad.b}" stroke="#fff" stroke-width="1.2" opacity=".8"/>`;

  const svg = $("#chart");
  const tAt = ev => {
    const b = svg.getBoundingClientRect();
    const x = ((ev.clientX - b.left) / b.width) * w;
    return Math.max(0, Math.min(dur, ((x - pad.l) / (w - pad.l - pad.r)) * dur));
  };
  svg.onmousemove = ev => {
    const t = tAt(ev);
    const r = DOC.timeline.reduce((a,b) => Math.abs(b.t-t) < Math.abs(a.t-t) ? b : a);
    $("#hov").innerHTML = `<b>${mmss(r.t)}</b> — ${r.people} people, ${r.vehicles} vehicles`
      + (r.conf != null ? ` · det conf ${r.conf}` : "");
  };
  svg.onmouseleave = () => { $("#hov").textContent = ""; };
  svg.onclick = ev => { const v = $("#vid"); v.currentTime = tAt(ev); v.play(); };
}
function playhead(t){
  const ph = $("#ph"); if (!ph) return;
  const {w,pad} = CH, dur = DOC.video.duration_s;
  const x = pad.l + (Math.min(t,dur)/dur) * (w - pad.l - pad.r);
  ph.setAttribute("x1", x); ph.setAttribute("x2", x);
}

/* ---------------------------------------------------------------- panels */
function drawSummary(){
  const s = DOC.summary;
  if (!s) { $("#sum").innerHTML = `<p class="err">No summary — the VLM stage was skipped or its reply did not parse.</p>`; return; }
  const ev = (s.events || []).filter(e => e && e !== "none");
  $("#sum").innerHTML =
    `<div class="head">${esc(s.headline || "")}</div>
     <p>${esc(s.summary || "")}</p>
     ${(s.timeline_notes || []).length ? `<ul class="notes">` + s.timeline_notes.map(n =>
        `<li><b>${esc(n.at)}</b><span>${esc(n.note)}</span></li>`).join("") + `</ul>` : ""}
     <div class="tags">
       ${s.walkway ? `<span class="tag wk">walking path: ${esc(s.walkway)}</span>` : ""}
       ${ev.map(e => `<span class="tag ev">${esc(e)}</span>`).join("")}
       ${(s.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
       <span class="tag">confidence: ${esc(s.confidence || "?")}</span>
     </div>
     ${s.busiest ? `<p class="vhint" style="margin-top:8px">busiest — ${esc(s.busiest)}</p>` : ""}
     ${s.walkway_detail ? `<p class="vhint">walking path — ${esc(s.walkway_detail)}</p>` : ""}`;
}

function drawQA(){
  const rows = DOC.qa || [];
  if (!rows.length) { $("#qa").innerHTML = `<p class="vhint">Q&amp;A stage not run.</p>`; return; }
  $("#qa").innerHTML = rows.map(r => {
    const a = r.answer;
    if (!a) return `<div class="q"><div class="qq">${esc(r.question)}</div>
      <div class="err">reply did not parse</div></div>`;
    const ev = (a.evidence || []).filter(e => e && e.at);
    return `<div class="q">
      <div class="qq">${esc(r.question)}</div>
      <div class="qa2">${esc(a.answer)}<span class="badge ${a.supported ? "ok" : "no"}">${
        a.supported ? "in footage" : "not visible"}</span></div>
      ${ev.length ? `<div class="ev">` + ev.map(e =>
        `<b>${esc(e.at)}</b> ${esc(e.what)}`).join("<br>") + `</div>` : ""}
      <div class="ev" style="margin-top:4px">${num(r.seconds,2)}s · confidence ${esc(a.confidence||"?")}</div>
    </div>`;
  }).join("");
}

function drawChunks(){
  $("#chunks").innerHTML = DOC.chunks.map(c => {
    const cap = c.caption;
    const ev = cap ? (cap.events || []).filter(e => e && e !== "none") : [];
    return `<button type="button" class="chunk" data-t="${c.t0}" data-c="${c.chunk}">
      <img src="data/${CUR}/strips/${esc(c.strip || "")}" alt="frames from ${mmss(c.t0)} to ${mmss(c.t1)}" loading="lazy">
      <div>
        <div class="t">${mmss(c.t0)}–${mmss(c.t1)} · peak ${c.people_peak} people · ${c.vehicles_peak} vehicles · ${num(c.vlm_seconds,1)}s</div>
        ${cap ? `<div class="c">${esc(cap.caption)}</div>
          ${cap.change ? `<div class="ch">changed: ${esc(cap.change)}</div>` : ""}
          <div class="m">${esc(cap.scene||"?")} · path ${esc(cap.walkway_status||"?")}${
            cap.walkway_reason ? ` (${esc(cap.walkway_reason)})` : ""}${
            ev.length ? ` · ${esc(ev.join(", "))}` : ""}</div>`
          : `<div class="c err">caption did not parse</div>`}
      </div></button>`;
  }).join("");
  $("#chunks").querySelectorAll(".chunk").forEach(b => b.onclick = () => {
    const v = $("#vid"); v.currentTime = +b.dataset.t; v.play();
  });
}
function syncChunk(t){
  const c = DOC.chunks.find(c => t >= c.t0 && t < c.t1);
  $("#chunks").querySelectorAll(".chunk").forEach(b =>
    b.toggleAttribute("aria-current", !!c && +b.dataset.c === c.chunk));
}

let SORT = {k:"dwell_s", dir:-1};
function drawTracks(){
  const rows = DOC.tracks.filter(t => t.confirmed).slice()
    .sort((a,b) => (a[SORT.k] > b[SORT.k] ? 1 : a[SORT.k] < b[SORT.k] ? -1 : 0) * SORT.dir);
  const col = id => `hsl(${(id*47)%360} 72% 62%)`;
  $("#trk").querySelector("tbody").innerHTML = rows.map(t => `<tr>
    <td class="l"><i class="dot" style="background:${col(t.id)}"></i>#${t.id}</td>
    <td>${mmss(t.t_start)}</td><td>${num(t.dwell_s,1)}s</td><td>${t.frames}</td>
    <td>${num(t.speed_bh_s,2)}</td><td class="l">${esc(t.motion)}</td>
    <td class="l">${esc(t.travel_label)}</td><td class="l">${esc(t.facing || "—")}</td>
    <td>${num(t.mean_conf,2)}</td></tr>`).join("");
  $("#trk").querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    SORT = {k, dir: SORT.k === k ? -SORT.dir : -1};
    drawTracks();
  });
}

function drawPerf(){
  const th = DOC.throughput, cfg = DOC.config, ag = DOC.aggregate;
  const r = [
    ["frames analysed", `${ag.frames_sampled} at ${cfg.sample_fps} fps`],
    ["detector", `${cfg.arch}, min_size ${cfg.min_size}`],
    ["detector mean", `${num(th.detector_ms_mean,1)} ms/frame`],
    ["detector median / p90", `${num(th.detector_ms_median,1)} / ${num(th.detector_ms_p90,1)} ms`],
  ];
  if (th.keypoint_ms_mean != null)
    r.push(["keypointrcnn pass", `${num(th.keypoint_ms_mean,1)} ms on ${th.keypoint_frames} frames with people`]);
  r.push(["per frame, GPU total", `${num(th.per_frame_total_ms,1)} ms → ${num(th.detector_fps,2)} fps`]);
  r.push(["realtime at source fps", th.realtime_at_source_fps ? `yes (source ${th.source_fps})` : `no (source ${th.source_fps})`]);
  r.push(["realtime at sample fps", th.realtime_at_sample_fps ? `yes (${cfg.sample_fps} fps)` : `no (${cfg.sample_fps} fps)`]);
  r.push(["ingest (ffmpeg)", `${num(th.ingest_ms_total,0)} ms total`]);
  r.push(["annotate", `${num(th.annotate_ms_per_frame,1)} ms/frame`]);
  r.push(["encode mp4", `${num(th.encode_ms_total,0)} ms total`]);
  if (th.vlm_chunk_mean_s != null) {
    r.push(["VLM chunk caption", `${num(th.vlm_chunk_mean_s,2)} s mean × ${th.vlm_chunk_seconds.length} chunks`]);
    r.push(["VLM summarize", `${num(th.vlm_summary_s,2)} s`]);
    r.push(["VLM total", `${num(th.vlm_total_s,1)} s over ${th.vlm_calls} calls`]);
    r.push(["VLM parse failures", `${th.vlm_parse_fails}`]);
  }
  $("#perf").innerHTML = r.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
}

boot();
</script>
</body>
</html>
